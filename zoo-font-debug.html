<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="zoo.css?v=20261106-5"><body style="padding:24px"><h1>Проверка файлов Ubuntu</h1><pre id="out">Загрузка…</pre><script>
(async()=>{const result=[];for(const weight of [300,400,500,700]){const family="Ubuntu";try{const loaded=await document.fonts.load(weight+' 20px "'+family+'"','Проверить льва Леона');result.push({family,count:loaded.length,faces:loaded.map(f=>({status:f.status,family:f.family,weight:f.weight}))});}catch(e){result.push({family,error:String(e)});}} const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');for(const family of ['Ubuntu','Arial']){ctx.font='500 14px "'+family+'"';result.push({family,width:ctx.measureText('Проверить льва Леона').width});}document.getElementById('out').textContent=JSON.stringify(result,null,2);})();
</script>
