<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Редактор генома — анимированные аватары</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--scale,1));background:url(assets/genome/cover-background.svg) center/100% 100%;overflow:hidden}.avatar{position:absolute;object-fit:contain;filter:sepia(1) saturate(5) hue-rotate(175deg) brightness(.85)}.boy{left:780px;top:-80px;width:700px;height:1180px}.girl{left:1270px;top:-20px;width:640px;height:1160px}
.card-layout .boy{left:380px}.card-layout .girl{left:870px}
</style><link rel="stylesheet" href="shared-cursor.css?v=9"></head><body><main class="stage" aria-label="Аватары детей по очереди приветствуют вас"><video class="avatar boy" muted loop playsinline preload="auto" poster="assets/genome-case/boy-greeting-transparent-v2-poster.png"><source src="assets/genome-case/boy-home-loop.webm" type="video/webm"></video><video class="avatar girl" muted loop playsinline preload="auto" poster="assets/genome-case/girl-greeting-transparent-v5-poster.png"><source src="assets/genome-case/girl-home-loop.webm" type="video/webm"></video></main><script>
if(new URLSearchParams(location.search).get('layout')==='card')document.documentElement.classList.add('card-layout');
const avatars=[...document.querySelectorAll('video')],motion=matchMedia('(prefers-reduced-motion:reduce)');let enabled=parent===window,ready=false;
function fit(){document.documentElement.style.setProperty('--scale',Math.max(innerWidth/1920,innerHeight/1080))}fit();addEventListener('resize',fit);
function start(){const active=ready&&enabled&&!document.hidden&&!motion.matches;avatars.forEach(v=>{if(active)v.play().catch(()=>{});else v.pause();});}
Promise.all(avatars.map(v=>new Promise(resolve=>{if(v.readyState>=1)resolve();else v.addEventListener('loadedmetadata',resolve,{once:true});}))).then(()=>{avatars.forEach(v=>v.playbackRate=v.duration/8.1);avatars[1].currentTime=avatars[1].duration/4;ready=true;start();});
addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='genome-play'){enabled=!!e.data.active;start();}});document.addEventListener('visibilitychange',start);motion.addEventListener('change',start);start();
</script><script src="shared-cursor.js" defer></script></body></html>
