<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Аватары редактора генома</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.pair{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#050505}.pair img{width:45%;height:100%;object-fit:contain;filter:sepia(1) saturate(5) hue-rotate(175deg) brightness(.85)}.running .pair{display:flex}.running .poster{display:none}@media(orientation:landscape){.pair{left:auto;right:0;width:76%}}</style><link rel="stylesheet" href="shared-cursor.css?v=9"></head><body><img class="poster" src="assets/genome-case/ipad-home-pair.jpg" alt="Дети приветствуют вас"><div class="pair" aria-hidden="true"><img src="assets/genome-case/boy-greeting-ipad.webp" alt=""><img src="assets/genome-case/girl-greeting-ipad.webp" alt=""></div><script>
const motion=matchMedia('(prefers-reduced-motion:reduce)');let enabled=parent===window;
function sync(){document.documentElement.classList.toggle('running',enabled&&!document.hidden&&!motion.matches);}
addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='genome-play'){enabled=!!e.data.active;sync();}});
document.addEventListener('visibilitychange',sync);motion.addEventListener('change',sync);addEventListener('pageshow',sync);sync();
</script><script src="shared-cursor.js" defer></script></body></html>
