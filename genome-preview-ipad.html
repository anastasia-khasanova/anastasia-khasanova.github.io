<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Аватары редактора генома</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain} @media(orientation:landscape){video{left:auto;right:0;width:76%}}</style><link rel="stylesheet" href="shared-cursor.css?v=9"></head><body><video muted loop playsinline preload="auto" poster="assets/genome-case/ipad-home-pair.jpg" src="assets/genome-case/ipad-home-pair.mp4" aria-label="Дети приветствуют вас"></video><script>
const video=document.querySelector('video'),motion=matchMedia('(prefers-reduced-motion:reduce)');let enabled=parent===window;
video.defaultMuted=true;video.muted=true;
function start(){if(enabled&&!document.hidden&&!motion.matches)video.play().catch(()=>{});else video.pause();}
addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='genome-play'){enabled=!!e.data.active;start();}});
video.addEventListener('canplay',start);document.addEventListener('visibilitychange',start);motion.addEventListener('change',start);addEventListener('pageshow',start);addEventListener('resize',start);start();
</script><script src="shared-cursor.js" defer></script></body></html>
